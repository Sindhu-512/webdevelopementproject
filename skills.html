    <style>

        /* =====================================================
           1. CUSTOM CSS VARIABLES
           Light Theme
        ===================================================== */

        :root {
            --primary: #4b4ded;
            --primary-dark: #3032b8;
            --secondary: #005fcc;

            --background: #f5f7ff;
            --surface: #ffffff;
            --surface-alt: #eef0ff;

            --text: #222222;
            --text-light: #555555;

            --border: #d9dcf0;

            --footer-bg: #222222;
            --footer-text: #ffffff;

            --shadow-small:
                0 4px 12px rgba(0, 0, 0, 0.08);

            --shadow-large:
                0 15px 35px rgba(0, 0, 0, 0.12);

            --radius-small: 10px;
            --radius-large: 18px;

            --space-xs: 8px;
            --space-sm: 15px;
            --space-md: 25px;
            --space-lg: 40px;
            --space-xl: 70px;

            --max-width: 1200px;

            --transition: 0.3s ease;
        }


        /* =====================================================
           2. DARK MODE VARIABLES
        ===================================================== */

        body.dark-mode {
            --primary: #7779ff;
            --primary-dark: #999bff;
            --secondary: #66aaff;

            --background: #111827;
            --surface: #1f2937;
            --surface-alt: #273449;

            --text: #f3f4f6;
            --text-light: #d1d5db;

            --border: #374151;

            --footer-bg: #080b10;
        }


        /* =====================================================
           3. GLOBAL RESET
        ===================================================== */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;
            line-height: 1.6;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(75, 77, 237, 0.12),
                    transparent 35%
                ),
                var(--background);

            color: var(--text);

            transition:
                background-color var(--transition),
                color var(--transition);
        }


        /* =====================================================
           4. ACCESSIBLE SKIP NAVIGATION
        ===================================================== */

        .skip-link {
            position: absolute;

            top: -60px;
            left: 10px;

            background-color: #000;
            color: #fff;

            padding: 12px 18px;

            text-decoration: none;
            font-weight: bold;

            border-radius: 0 0 8px 8px;

            z-index: 9999;

            transition: top var(--transition);
        }

        .skip-link:focus {
            top: 10px;
        }


        /* =====================================================
           5. KEYBOARD FOCUS
        ===================================================== */

        :focus-visible {
            outline: 3px solid #005fcc;
            outline-offset: 4px;
        }


        /* =====================================================
           6. HEADER
           Flexbox for localized alignment
        ===================================================== */

        header {
            position: sticky;
            top: 0;
            z-index: 1000;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--primary-dark)
                );

            color: #ffffff;

            padding: 20px;

            box-shadow: var(--shadow-large);
        }


        .header-container {
            max-width: var(--max-width);
            margin: auto;

            display: flex;

            /* Mobile-first */
            flex-direction: column;

            align-items: center;

            gap: var(--space-md);
        }


        header h1 {
            margin: 0;

            text-align: center;

            font-size:
                clamp(2rem, 5vw, 3.2rem);

            letter-spacing: -1px;

            text-shadow:
                0 3px 10px rgba(0, 0, 0, 0.2);
        }


        /* =====================================================
           7. NAVIGATION
           Flexbox
        ===================================================== */

        nav {
            width: 100%;
        }


        nav ul {
            display: flex;

            flex-wrap: wrap;

            justify-content: center;
            align-items: center;

            gap: 10px 18px;

            list-style: none;

            padding: 0;
            margin: 0;
        }


        nav a {
            display: inline-block;

            color: #ffffff;

            font-weight: bold;

            text-decoration: none;

            padding: 8px 12px;

            border-radius: var(--radius-small);

            transition:
                background-color var(--transition),
                transform var(--transition);
        }


        nav a:hover {
            background-color:
                rgba(255, 255, 255, 0.18);

            transform: translateY(-2px);
        }


        nav a[aria-current="page"] {
            background-color: #ffffff;
            color: var(--primary);
        }


        /* =====================================================
           8. DARK MODE BUTTON
        ===================================================== */

        .theme-button {
            border: 2px solid
                rgba(255, 255, 255, 0.8);

            background:
                rgba(255, 255, 255, 0.12);

            color: #ffffff;

            padding: 9px 16px;

            border-radius: 50px;

            font-weight: bold;

            cursor: pointer;

            transition:
                background-color var(--transition),
                transform var(--transition);
        }


        .theme-button:hover {
            background:
                rgba(255, 255, 255, 0.25);

            transform: translateY(-2px);
        }


        /* =====================================================
           9. MAIN CONTENT
        ===================================================== */

        main {
            width: min(
                calc(100% - 30px),
                var(--max-width)
            );

            margin: auto;

            padding:
                var(--space-lg)
                0
                var(--space-xl);
        }


        /* =====================================================
           10. SKILLS SECTION
        ===================================================== */

        .skills-section {
            background:
                linear-gradient(
                    145deg,
                    var(--surface),
                    var(--surface-alt)
                );

            padding:
                clamp(20px, 5vw, 50px);

            border:
                1px solid var(--border);

            border-radius:
                var(--radius-large);

            box-shadow:
                var(--shadow-large);

            position: relative;

            overflow: hidden;
        }


        /* Decorative CSS3 element */

        .skills-section::before {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            top: -90px;
            right: -90px;

            background:
                var(--primary);

            opacity: 0.08;

            border-radius: 50%;

            filter: blur(5px);
        }


        /* =====================================================
           11. SECTION HEADING
        ===================================================== */

        .section-heading {
            margin-top: 0;

            margin-bottom: var(--space-lg);

            text-align: center;

            font-size:
                clamp(1.8rem, 4vw, 2.7rem);

            color: var(--primary);
        }


        /* =====================================================
           12. CSS GRID
           Complex two-dimensional layout
        ===================================================== */

        .skills-grid {
            display: grid;

            /* Mobile-first */
            grid-template-columns: 1fr;

            gap: var(--space-md);
        }


        /* =====================================================
           13. SKILL CARDS
           Flexbox for localized alignment
        ===================================================== */

        .skill-card {
            display: flex;

            flex-direction: column;

            justify-content: center;
            align-items: center;

            min-height: 150px;

            padding: 25px;

            text-align: center;

            background:
                var(--surface);

            border:
                1px solid var(--border);

            border-radius:
                var(--radius-large);

            box-shadow:
                var(--shadow-small);

            transition:
                transform var(--transition),
                box-shadow var(--transition),
                border-color var(--transition);
        }


        /* Hover animation */

        .skill-card:hover {
            transform:
                translateY(-8px)
                scale(1.02);

            box-shadow:
                var(--shadow-large);

            border-color:
                var(--primary);
        }


        /* =====================================================
           14. SKILL ICON / NUMBER
        ===================================================== */

        .skill-number {
            display: flex;

            align-items: center;
            justify-content: center;

            width: 55px;
            height: 55px;

            margin-bottom: 12px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--secondary)
                );

            color: #ffffff;

            font-size: 1.2rem;

            font-weight: bold;

            box-shadow:
                0 8px 18px
                rgba(75, 77, 237, 0.25);
        }


        .skill-card h3 {
            margin: 0;

            font-size:
                clamp(1.1rem, 2.5vw, 1.4rem);

            color: var(--primary);
        }


        /* =====================================================
           15. FOOTER
        ===================================================== */

        footer {
            background-color:
                var(--footer-bg);

            color:
                var(--footer-text);

            text-align: center;

            padding: 25px 20px;

            border-top:
                1px solid var(--border);
        }


        footer p {
            margin: 0;

            font-size: 0.95rem;
        }


        /* =====================================================
           16. TABLET
           600px+
        ===================================================== */

        @media (min-width: 600px) {

            .header-container {
                flex-direction: row;

                justify-content:
                    space-between;

                align-items: center;
            }


            header h1 {
                text-align: left;
            }


            nav {
                width: auto;
            }


            nav ul {
                justify-content: flex-end;
            }


            /* CSS Grid: 2 columns */

            .skills-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

        }


        /* =====================================================
           17. DESKTOP
           900px+
        ===================================================== */

        @media (min-width: 900px) {

            main {
                padding-top: 60px;
            }


            /* CSS Grid: 3 columns */

            .skills-grid {
                grid-template-columns:
                    repeat(3, minmax(0, 1fr));
            }


            .skill-card {
                min-height: 180px;
            }

        }


        /* =====================================================
           18. LARGE DESKTOP
           1200px+
        ===================================================== */

        @media (min-width: 1200px) {

            .skills-grid {
                grid-template-columns:
                    repeat(3, minmax(280px, 1fr));

                gap: 30px;
            }


            .skill-card {
                padding: 35px;
            }

        }


        /* =====================================================
           19. REDUCED MOTION
           Accessibility
        ===================================================== */

        @media (prefers-reduced-motion: reduce) {

            html {
                scroll-behavior: auto;
            }

            *,
            *::before,
            *::after {
                transition: none !important;
                animation: none !important;
            }

        }

    </style>

</head>

    <!-- =========================================
         6. LIGHT / DARK MODE JAVASCRIPT
    ========================================== -->

    <script>

        const themeToggle =
            document.getElementById("themeToggle");

        const body =
            document.body;


        themeToggle.addEventListener("click", function () {

            body.classList.toggle("dark-mode");


            if (body.classList.contains("dark-mode")) {

                themeToggle.textContent =
                    "☀️ Light Mode";

                themeToggle.setAttribute(
                    "aria-label",
                    "Switch to light mode"
                );

            } else {

                themeToggle.textContent =
                    "🌙 Dark Mode";

                themeToggle.setAttribute(
                    "aria-label",
                    "Switch to dark mode"
                );

            }

        });

    </script>
