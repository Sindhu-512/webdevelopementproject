<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =========================================
         BASIC HTML5 METADATA
    ========================================== -->

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">


    <!-- =========================================
         SEO OPTIMIZATION
    ========================================== -->

    <meta name="description"
          content="Contact Bandari Sindhu through an accessible contact form for questions, project discussions, and professional communication.">

    <meta name="author"
          content="Bandari Sindhu">

    <meta name="robots"
          content="index, follow">


    <!-- Open Graph SEO -->
    <meta property="og:title"
          content="Contact Bandari Sindhu">

    <meta property="og:description"
          content="Get in touch with Bandari Sindhu through the accessible contact form.">

    <meta property="og:type"
          content="website">


    <!-- SEO-friendly page title -->
    <title>Contact Bandari Sindhu | Accessible Contact Form</title>


    <!-- =========================================
         ACCESSIBILITY AND STYLING
    ========================================== -->

    <style>

        /* =========================================
           1. SKIP NAVIGATION
        ========================================== */

        .skip-link {
            position: absolute;
            top: -50px;
            left: 10px;

            background-color: #000;
            color: #fff;

            padding: 10px 16px;

            text-decoration: none;
            font-weight: bold;

            z-index: 1000;
        }

        /* Show skip link when focused */
        .skip-link:focus {
            top: 10px;
        }


        /* =========================================
           2. KEYBOARD FOCUS
        ========================================== */

        :focus-visible {
            outline: 3px solid #005fcc;
            outline-offset: 3px;
        }


        /* =========================================
           BASIC PAGE STYLING
        ========================================== */

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            line-height: 1.6;

            background-color: #f5f7ff;
            color: #222;
        }


        /* =========================================
           HEADER
        ========================================== */

        header {
            background-color: #4b4ded;
            color: #ffffff;
            padding: 20px;
        }


        /* =========================================
           NAVIGATION
        ========================================== */

        nav ul {
            display: flex;
            flex-wrap: wrap;

            gap: 20px;

            list-style: none;

            padding: 0;
            margin: 15px 0 0;
        }

        nav a {
            color: #ffffff;

            font-weight: bold;

            text-decoration: none;
        }

        nav a:hover,
        nav a:focus-visible {
            text-decoration: underline;
        }


        /* =========================================
           MAIN CONTENT
        ========================================== */

        main {
            max-width: 900px;

            margin: auto;

            padding: 30px 20px;
        }


        /* =========================================
           SECTION
        ========================================== */

        section {
            background-color: #ffffff;

            padding: 25px;

            margin-bottom: 25px;

            border-radius: 8px;
        }


        /* =========================================
           FORM
        ========================================== */

        form {
            max-width: 500px;

            display: flex;
            flex-direction: column;

            gap: 1rem;
        }


        /* =========================================
           FORM LABELS
        ========================================== */

        label {
            display: block;

            margin-bottom: 0.25rem;

            font-weight: bold;
        }


        /* =========================================
           FORM CONTROLS
        ========================================== */

        input,
        textarea,
        button {
            width: 100%;

            box-sizing: border-box;

            font-size: 1rem;

            padding: 0.7rem;
        }


        input,
        textarea {
            border: 2px solid #555;

            border-radius: 4px;
        }


        /* =========================================
           SUBMIT BUTTON
        ========================================== */

        button {
            background-color: #004499;

            color: #ffffff;

            border: none;

            border-radius: 4px;

            cursor: pointer;

            font-weight: bold;
        }

        button:hover,
        button:focus-visible {
            background-color: #003366;
        }


        /* =========================================
           FOOTER
        ========================================== */

        footer {
            background-color: #222;

            color: #ffffff;

            text-align: center;

            padding: 20px;
        }

    </style>

</head>


<body>


    <!-- =========================================
         3. ACCESSIBLE SKIP LINK

         Allows keyboard and screen-reader users
         to skip navigation.
    ========================================== -->

    <a href="#main-content"
       class="skip-link">

        Skip to main content

    </a>


    <!-- =========================================
         4. SEMANTIC HEADER
    ========================================== -->

    <header>

        <h1>Contact Me</h1>


        <!-- =========================================
             5. SEMANTIC NAVIGATION

             aria-label identifies the navigation
             landmark for screen readers.
        ========================================== -->

        <nav aria-label="Main navigation">

            <ul>

                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="about.html">
                        About
                    </a>
                </li>

                <li>
                    <a href="projects.html">
                        Projects
                    </a>
                </li>

                <li>
                    <a href="skills.html">
                        Skills
                    </a>
                </li>

                <li>
                    <a href="contact.html"
                       aria-current="page">

                        Contact

                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- =========================================
         6. SEMANTIC MAIN CONTENT

         tabindex="-1" allows the skip link to move
         keyboard focus directly to main content.
    ========================================== -->

    <main id="main-content"
          tabindex="-1">


        <!-- =========================================
             CONTACT SECTION
        ========================================== -->

        <section aria-labelledby="contact-heading">


            <h2 id="contact-heading">
                Get In Touch
            </h2>


            <!--
                Instructions are connected to the form
                using aria-describedby.
            -->

            <p id="form-instructions">

                If you have any questions or would like
                to reach out, please fill out the form below.
                All fields marked with an asterisk (*)
                are required.

            </p>


            <!-- =========================================
                 ACCESSIBLE CONTACT FORM
            ========================================== -->

            <form action="#"
                  method="post"
                  aria-describedby="form-instructions">


                <!-- FULL NAME -->

                <div>

                    <label for="name">
                        Full Name
                        <span aria-hidden="true">*</span>
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        autocomplete="name"
                        required
                        aria-required="true">

                </div>


                <!-- EMAIL -->

                <div>

                    <label for="email">
                        Email Address
                        <span aria-hidden="true">*</span>
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        inputmode="email"
                        required
                        aria-required="true">

                </div>


                <!-- SUBJECT -->

                <div>

                    <label for="subject">
                        Subject
                        <span aria-hidden="true">*</span>
                    </label>

                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        autocomplete="off"
                        required
                        aria-required="true">

                </div>


                <!-- MESSAGE -->

                <div>

                    <label for="message">
                        Message
                        <span aria-hidden="true">*</span>
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        required
                        aria-required="true"></textarea>

                </div>


                <!-- SUBMIT BUTTON -->

                <button type="submit">
                    Send Message
                </button>


            </form>

        </section>

    </main>


    <!-- =========================================
         7. SEMANTIC FOOTER
    ========================================== -->

    <footer>

        <p>
            &copy; 2026 Bandari Sindhu.
            All Rights Reserved.
        </p>

    </footer>


</body>

</html>
